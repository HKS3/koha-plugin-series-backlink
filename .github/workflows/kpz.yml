name: Build KPZ

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kpz:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip nodejs gettext libmodern-perl-perl libjson-perl

      - name: Run tests and translation checks
        run: |
          prove -v t
          for po in po/*.po; do
            msgfmt --check --output-file=/dev/null "$po"
          done

      - name: Build KPZ
        id: build
        run: |
          kpz="$(./scripts/build-kpz)"
          unzip -t "$kpz"
          echo "kpz=$kpz" >> "$GITHUB_OUTPUT"

      - name: Upload KPZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: koha-plugin-series-backlink-kpz
          path: ${{ steps.build.outputs.kpz }}
          if-no-files-found: error

      - name: Attach KPZ to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          kpz="${{ steps.build.outputs.kpz }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$kpz" --clobber
          else
            gh release create "$tag" "$kpz" --title "$tag" --generate-notes
          fi
